<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCP ClearKey DRM Sandbox</title>
    
    <!-- Load modern Shaka Player engine and compiled UI elements -->
    <script src="shaka-player.compiled.js"></script>
    <link rel="stylesheet" href="controls.css">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        .video-wrapper {
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        video {
            width: 100%;
            display: block;
        }
        h2 { margin-bottom: 5px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
    </style>
</head>
<body>

<div class="container">
    <h2>GCP Transcoder + ClearKey DRM</h2>
    <p>Streaming encrypted DASH through Shaka Player</p>

    <div class="video-wrapper" data-shaka-player-container>
        <!-- The HTML5 video element targeted by the Shaka UI/Engine wrapper -->
        <video id="video" data-shaka-player autoplay muted controls></video>
    </div>
</div>

<script>
    const LICENSE_SERVER_BASE = "https://license-server-2j6vscsfjq-nw.a.run.app";
    const VIDEO_ID = "demo-final";
    const MANIFEST_URL = `${LICENSE_SERVER_BASE}/streams/${VIDEO_ID}/manifest.mpd`;
    const LICENSE_SERVER_URL = `${LICENSE_SERVER_BASE}/get-clearkey`;

    async function initSandboxPlayer() {
        if (typeof shaka === 'undefined') {
            setTimeout(initSandboxPlayer, 100);
            return;
        }

        console.log("Bootstrap sequence initiated: Setting up authenticated polyfills...");
        shaka.polyfill.installAll();

        const video = document.getElementById('video');
        video.addEventListener('pointerdown', () => {
            video.muted = false;
        }, { once: true });
        const player = new shaka.Player(video);

        // 2. Configure DRM licensing endpoint
        player.configure({
            drm: {
                servers: {
                    'org.w3.clearkey': LICENSE_SERVER_URL
                }
            }
        });

        // 3. NETWORK FILTER INTERCEPTORS
        player.getNetworkingEngine().registerRequestFilter((type, request) => {
            if (type === shaka.net.NetworkingEngine.RequestType.LICENSE) {
                console.log('Fetching ClearKey license:', request.uris);
            }
        });

        player.getNetworkingEngine().registerResponseFilter((type, response) => {
            if (type === shaka.net.NetworkingEngine.RequestType.LICENSE) {
                console.log('Received ClearKey license response.');
            }
        });

        console.log("Attempting to load encrypted DASH manifest:", MANIFEST_URL);
        try {
            await player.load(MANIFEST_URL);
            await video.play();
            console.log('Playback active: ClearKey decryption succeeded.');
        } catch (error) {
            console.error('❌ Shaka Engine Error Code:', error.code, error);
        }
    }

    window.onload = () => {
        initSandboxPlayer();
    };
</script>

</body>
</html>
